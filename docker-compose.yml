version: '3.8'

services:
  # ────────────────────────────────────────────────────────────────
  # 启用登录功能后必须挂载 DATA_DIR，否则容器重建会丢失账号
  # 与找回码，导致只能删掉 data/auth.json 重新初始化。
  #
  # 用官方镜像（下面的 image 段）不含本仓库的登录改动，
  # 要使用登录功能请改为本地构建：
  #   services:
  #     file-transfer-go:
  #       build: .
  # ────────────────────────────────────────────────────────────────
  file-transfer-go:
    image: matrixseven/file-transfer-go:latest
    # 使用本仓库代码构建时取消下面一行注释并删掉 image 段
    # build: .
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
    volumes:
      # 账号数据：auth.json（密码/找回码哈希）与 secret.key（会话签名密钥）
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/auth/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
