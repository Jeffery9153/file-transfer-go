version: '3.8'

services:
  file-transfer-go:
    # 用本仓库代码构建（含登录功能）。
    # 若只想跑上游官方版本，改成 image: matrixseven/file-transfer-go:latest 并删掉 build 段。
    build:
      context: .
      dockerfile: Dockerfile
    image: file-transfer-go:auth
    container_name: file-transfer-go
    ports:
      - "7880:8080"
    environment:
      - TZ=Asia/Shanghai
      - DATA_DIR=/app/data
    volumes:
      # 账号数据：auth.json（密码/找回码哈希）与 secret.key（会话签名密钥）
      # 用 named volume 而非 ./data，避免宿主机 uid 与容器内 appuser 不一致导致无写权限
      - ftg-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/auth/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  ftg-data:
